name: Release

# Al subir un tag vX.Y.Z: comprueba, compila la release firmada y la publica en GitHub con el APK
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Check version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con versionName ($version)"
            exit 1
          fi

      - name: Decode keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # No está en el repositorio, que es público; sin él no compila
      - name: Decode google-services.json
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      # Clave de la cuenta de servicio padelprat-fcm (solo FCM): con ella la app avisa al amigo de los cambios
      - name: Decode FCM service account
        run: echo "$FCM_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/fcm.json"
        env:
          FCM_SERVICE_ACCOUNT_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}

      - name: Build
        run: ./gradlew ktlintCheck lintDebug assembleRelease
        env:
          ORG_GRADLE_PROJECT_padelpratStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_padelpratStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_padelpratFcmServiceAccount: ${{ runner.temp }}/fcm.json

      # Sin firma, Gradle lo llamaría app-release-unsigned.apk y este paso fallaría
      - name: Publish
        run: |
          apk="PadelPrat-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "PadelPrat ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove keys
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/fcm.json"
